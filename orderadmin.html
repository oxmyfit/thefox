<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Fox Orders Admin</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="orderadmin.js" defer></script>
  </head>
  <body class="admin-body locked">
    <section class="admin-gate" id="adminGate">
      <form class="gate-panel" id="gateForm">
        <a class="brand gate-brand" href="index.html">
          <span class="brand-mark"><img src="assets/thefox-logo.svg" alt="" /></span>
          <span>The Fox</span>
        </a>
        <p class="eyebrow">Private Access</p>
        <h1>Enter admin code.</h1>
        <label>
          Access Code
          <input name="code" type="password" autocomplete="off" required />
        </label>
        <button class="solid-button" type="submit">Unlock Orders</button>
        <p class="form-message gate-error" id="gateMessage" role="status"></p>
      </form>
    </section>

    <header class="admin-header protected-content" hidden>
      <a class="brand" href="index.html">
        <span class="brand-mark"><img src="assets/thefox-logo.svg" alt="" /></span>
        <span>The Fox</span>
      </a>
      <div class="header-actions">
        <button class="ghost-button icon-button" id="refreshOrders" type="button" title="Refresh orders" aria-label="Refresh orders">
          <i data-lucide="refresh-cw"></i>
        </button>
        <a class="solid-button" href="order.html">View Delivery</a>
      </div>
    </header>

    <main class="admin-shell protected-content" hidden>
      <section class="admin-title">
        <p class="eyebrow">Live orders</p>
        <h1>Delivery requests.</h1>
      </section>

      <section class="orders-panel-wrap">
        <div class="order-admin-panel">
          <div class="order-dashboard-toolbar">
            <div>
              <p class="eyebrow small">Daily overview</p>
              <h2 id="selectedDateTitle">Today</h2>
            </div>
            <div class="date-controls">
              <button class="ghost-button" id="todayOrders" type="button">Today</button>
              <input id="ordersDate" type="date" aria-label="Choose order date" />
            </div>
          </div>

          <div class="order-date-tabs" id="orderDateTabs" aria-label="Order dates"></div>

          <div class="order-stats">
            <article><span>Orders</span><strong id="statOrders">0</strong></article>
            <article><span>Accepted</span><strong id="statAccepted">0</strong></article>
            <article><span>Denied</span><strong id="statDenied">0</strong></article>
            <article><span>Revenue</span><strong id="statRevenue">0 ALL</strong></article>
          </div>

          <div class="panel-heading">
            <h2>Incoming orders</h2>
            <span class="live-pill" id="livePill">Live</span>
          </div>
          <div id="ordersList" class="orders-list"></div>
        </div>
      </section>
    </main>
  </body>
</html>
